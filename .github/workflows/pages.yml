name: Deploy to GitHub Pages
on:
  push:
    branches: "main"
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Process emails
        run: python scripts/process_emails.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          CLIENT_PASSPHRASE: ${{ secrets.CLIENT_PASSPHRASE }}
          CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      
      - name: Check for changes
        id: changes
        run: |
          git add .
          # Check if only processed_messages.txt changed
          changed_files=$(git diff --staged --name-only)
          if [ -z "$changed_files" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          elif [ "$changed_files" = "processed_messages.txt" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Only processed_messages.txt changed, skipping build"
            git config user.name "Email Bot"
            git config user.email "bot@example.com"
            git commit -m "Update processed messages"
            git push
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected: $changed_files"
          fi
      
      - name: Commit and push email changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "Email Bot"
          git config user.email "bot@example.com"
          git commit -m "Auto-sync from email"
          git push
      
      - name: Clean up filenames
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          find . -type f -name '*.JPG' -exec sh -c 'mv "$1" "${1%.*}.jpg"' sh {} \;
          find . -type f -name '*.JPEG' -exec sh -c 'mv "$1" "${1%.*}.jpeg"' sh {} \;
          find . -type f -name '*.PNG' -exec sh -c 'mv "$1" "${1%.*}.png"' sh {} \;
      
      - name: Install Node.js
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: npm install
      
      - name: Move files
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          find static/images/kunstwerke -type f -exec sh -c '
            src="$1"
            year=$(echo "$src" | grep -oP "kunstwerke/\K\d{4}")
            dest="src/lib/images/kunstwerke/$year/$(basename "$src")"
            mkdir -p "$(dirname "$dest")"
            mv "$src" "$dest"
          ' sh {} \;
    
      - name: build
        if: steps.changes.outputs.has_changes == 'true'
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
        run: npm run build
      
      - name: Upload Artifacts
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build/"
      
      - name: Deploy
        if: steps.changes.outputs.has_changes == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
